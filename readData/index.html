<!DOCTYPE html>
<html>
<body>
  <button id="connect">Connect Arduino</button>
  <h2>Serial Output:</h2>
  <!-- Changed from <span> to a <div> to hold multiple lines -->
  <div id="output" style="font-family: monospace;">Waiting...</div>

  <script>
    document.getElementById('connect').addEventListener('click', async () => {
      // 1. Prompt user to select the Arduino USB port
      const port = await navigator.serial.requestPort();
      await port.open({ baudRate: 9600 });

      const outputDiv = document.getElementById('output');
      outputDiv.innerHTML = ""; // Clear "Waiting..." once connected

      // 2. Decode incoming serial bytes into text
      const textDecoder = new TextDecoderStream();
      port.readable.pipeTo(textDecoder.writable);
      const reader = textDecoder.readable.getReader();

      let buffer = "";
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += value;
        
        // 3. Split by newline (from Serial.println) and append each line
        let lines = buffer.split("\n");
        buffer = lines.pop(); 

        for (const line of lines) {
          const cleanLine = line.trim();
          if (cleanLine) {
            const lineElement = document.createElement('div');
            lineElement.textContent = cleanLine;
            outputDiv.appendChild(lineElement);
          }
        }
      }
    });
  </script>
</body>
</html>
